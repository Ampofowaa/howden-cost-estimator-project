[project]
name = "howden-cost-estimator-project"
version = "0.1.0"
description = "Annual PMI coverage, cost and affordability scenario estimator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "shiny>=1.9.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmi_estimator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
